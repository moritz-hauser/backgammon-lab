[project]
name = "bg-lab"
version = "0.1.0"
dependencies = [
"pandas>=2.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]



[tool.pytest.ini_options]
markers = [
  "slow: long-running or expensive tests",
]
